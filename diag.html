<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Diag2</title>
<style>body{background:#0a0a12;color:#ecebf5;font:15px -apple-system,sans-serif;margin:0;padding:14px}
#st{font-size:22px;font-weight:700;padding:8px 0}.run{color:#2ed573}.bad{color:#ff4d6d}
button{font:17px -apple-system;padding:14px 18px;margin:4px 6px 4px 0;border-radius:10px;border:1px solid #333;background:#1a1a28;color:#fff}
#log{font:12px ui-monospace,monospace;white-space:pre-wrap;background:#06060c;border:1px solid #262636;border-radius:8px;padding:10px;height:340px;overflow:auto;margin-top:8px}</style>
</head><body>
<div id=st>—</div>
<button id=go>DESTRAVAR + MANTER</button>
<div id=log></div>
<script>
const AC=window.AudioContext||window.webkitAudioContext;
const ctx=new AC({latencyHint:'interactive'});
const g=ctx.createGain();g.gain.value=.8;g.connect(ctx.destination);
const logEl=document.getElementById('log');
const L=m=>{logEl.textContent=`[${(performance.now()/1000).toFixed(1)}s] ${m}\n`+logEl.textContent;};

function wav(seg=2,sr=8000){const n=sr*seg,b=new ArrayBuffer(44+n*2),v=new DataView(b);
const t=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
t(0,'RIFF');v.setUint32(4,36+n*2,true);t(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);
v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);
v.setUint16(34,16,true);t(36,'data');v.setUint32(40,n*2,true);
for(let i=0;i<n;i++)v.setInt16(44+i*2,i%2?1:-1,true);
let s='';const u=new Uint8Array(b);for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);
return 'data:audio/wav;base64,'+btoa(s);}

const keeper=new Audio();keeper.loop=true;keeper.volume=.02;keeper.src=wav();keeper.setAttribute('playsinline','');
keeper.addEventListener('pause',()=>L('KEEPER pausou (paused='+keeper.paused+')'));
keeper.addEventListener('play',()=>L('KEEPER tocando'));
keeper.addEventListener('ended',()=>L('KEEPER terminou'));

function paint(){const s=ctx.state;const e=document.getElementById('st');
e.textContent=s.toUpperCase()+' | keeper:'+(keeper.paused?'PAUSADO':'tocando')+' | aS:'+(navigator.audioSession?navigator.audioSession.type:'-');
e.className=(s==='running'&&!keeper.paused)?'run':'bad';}

ctx.addEventListener('statechange',()=>{L('ctx -> '+ctx.state);paint();});
document.addEventListener('visibilitychange',()=>L('visibility hidden='+document.hidden+' ctx='+ctx.state+' keeper.paused='+keeper.paused));
window.addEventListener('pageshow',()=>L('pageshow ctx='+ctx.state+' keeper.paused='+keeper.paused));

document.getElementById('go').addEventListener('click',async()=>{
  try{if(navigator.audioSession)navigator.audioSession.type='playback';L('audioSession='+navigator.audioSession?.type);}catch(e){L('audioSession erro '+e.name);}
  try{await keeper.play();L('keeper.play() OK');}catch(e){L('keeper.play() FALHOU: '+e.name+' '+e.message.slice(0,50));}
  try{await ctx.resume();L('resume OK ctx='+ctx.state);}catch(e){L('resume FALHOU '+e.name);}
  paint();
});
setInterval(paint,400);paint();L('inicio ctx='+ctx.state);
</script></body></html>
